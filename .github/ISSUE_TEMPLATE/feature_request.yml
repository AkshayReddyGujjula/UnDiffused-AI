name: Feature request
description: Propose a focused product, model, evaluation or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the smallest useful version of the idea.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and trade-offs
      description: Include relevant measurements, examples, privacy effects or deployment constraints.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: I understand that detector claims need content-matched external evidence.
          required: true
        - label: I have described any new network, permission or data-handling requirement.
          required: true
