name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension and repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact JavaScript dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build the extension
        run: npm run build

      - name: Check documentation and repository hygiene
        run: npm run verify:repo

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q scripts

  large-file-integrity:
    name: Large-file integrity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify large-file objects
        run: git lfs fsck
